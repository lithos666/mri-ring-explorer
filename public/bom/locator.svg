<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400" role="img" aria-label="Cylindrical 18 mm inter-layer spacer with an M6 through-passage; diameters are illustrative">
  <title>Cylindrical 18 mm inter-layer spacer with an M6 through-passage</title>
  <desc>The axial length is 18 mm. Outer diameter and M6 clearance-hole diameter are not specified; their appearance is illustrative.</desc>
