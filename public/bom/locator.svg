  <path d="M193,260 A91,29 0 0 0 375,260 M193,236 A91,29 0 0 0 375,236 M193,211 A91,29 0 0 0 375,211 M193,187 A91,29 0 0 0 375,187 M193,162 A91,29 0 0 0 375,162" fill="none" stroke="#b3a993" stroke-width=".65" opacity=".4"/>
  <ellipse cx="284" cy="135" rx="96" ry="31" fill="url(#top)" stroke="#7e817d" stroke-width="1.3"/>
  <ellipse cx="284" cy="135" rx="43" ry="14" fill="url(#bore)" stroke="#928879" stroke-width="1.1"/>
  <ellipse cx="284" cy="141" rx="38" ry="8" fill="#f9fbfd"/>
  <path d="M242,136 A42,13 0 0 0 326,136" fill="none" stroke="#c4baa5" stroke-width="1.2"/>
