    <linearGradient id="bore" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#655f52"/><stop offset="1" stop-color="#b4aa98"/></linearGradient>
    <radialGradient id="floor"><stop stop-color="#b9c5d2" stop-opacity=".27"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
    <marker id="arrow" viewBox="0 0 8 8" refX="4" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8 Z" fill="#586c81"/></marker>
  </defs>
