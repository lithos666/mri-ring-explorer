    <linearGradient id="body" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#d8cbb7"/><stop offset=".35" stop-color="#f5eddf"/><stop offset=".7" stop-color="#dfd3bf"/><stop offset="1" stop-color="#b4a891"/></linearGradient>
